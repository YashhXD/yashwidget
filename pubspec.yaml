name: portfolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  auto_scrolling: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Removed the duplicate entry here
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/terminal.png
    - assets/insta_work.png
    - assets/soundboard.png
    - assets/logos/flutter.png
    - assets/logos/django.png
    - assets/logos/Dart.png
    - assets/logos/Java.png
    - assets/logos/html.png
    - assets/logos/cpp.png
    - assets/logos/js.png
    - assets/logos/python.png
    - assets/logos/blender.png
    - assets/logos/ae.png
    - assets/logos/pp.png
    - assets/background/back.jpg

  fonts:
    - family: Meringue
      fonts:
        - asset: assets/fonts/meringue.OTF
          weight: 800
      
    - family: Baro
      fonts:
        - asset: assets/fonts/barostico.OTF
    
    - family : Aktiv
      fonts:
        - asset: assets/fonts/AktivGrotesk.OTF

    - family : SpaceR
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf

    - family : SpaceB
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf

    - family : SpaceSB
      fonts:
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf